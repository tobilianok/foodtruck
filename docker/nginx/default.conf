# Foodtruck - Nginx interne (derrière Nginx Proxy Manager)
server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    client_max_body_size 25M;
    server_tokens off;

    # v0.16.3 : l'adresse de foodtruck-app est redemandée au DNS de Docker (au plus toutes les 10 s) au lieu d'être
    # retenue au démarrage de Nginx. Sinon, quand foodtruck-app redémarre avec une autre adresse IP, Nginx garde
    # l'ancienne et le site répond « 502 Bad Gateway » (incident du 2026-10-06).
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        set $php_upstream foodtruck-app:9000;
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
